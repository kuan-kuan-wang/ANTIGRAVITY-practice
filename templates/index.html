<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!-- 引入 Tailwind CSS 進行現代化美觀排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 md:p-12 max-w-lg w-full text-center transform transition-all duration-300 hover:scale-[1.01]">
        <!-- 圖示區塊 -->
        <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full mb-6 shadow-inner">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <!-- 標題與問候語 -->
        <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight mb-3">
            {{ title }}
        </h1>
        <p class="text-gray-600 text-lg mb-6 leading-relaxed">
            {{ message }}
        </p>

        <!-- 部署狀態標籤 -->
        <div class="mb-6 flex justify-center">
            {% if is_cloud %}
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 shadow-sm border border-emerald-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                ☁️ Render 雲端運作中
            </span>
            {% else %}
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800 shadow-sm border border-blue-200">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                💻 本地開發環境
            </span>
            {% endif %}
        </div>

        <!-- 互動卡片 -->
        <div class="bg-gray-50 border border-gray-100 rounded-xl p-5 mb-6 text-left">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">運行狀態</h2>
                <span class="text-xs text-indigo-600 font-medium">CI/CD 自動交付 ✨</span>
            </div>
            <div class="flex items-center space-x-2 text-green-600 font-medium">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span>Flask 伺服器運作正常</span>
            </div>
            <p class="text-xs text-gray-500 mt-2">
                目前網址：<code id="currentUrl" class="bg-gray-200 px-1.5 py-0.5 rounded text-gray-700">載入中...</code>
            </p>
        </div>

        <!-- 互動按鈕與點擊計數 -->
        <div class="space-y-4">
            <button id="clickBtn" class="w-full py-3 px-6 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium rounded-xl shadow-lg hover:from-indigo-700 hover:to-purple-700 transition duration-200 transform active:scale-95 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                點擊互動看看 ✨
            </button>
            <p id="counterText" class="text-sm text-gray-500">你已經點擊了 <span id="count" class="font-bold text-indigo-600">0</span> 次</p>
        </div>
    </div>

    <script>
        // 動態偵測並顯示目前網址
        document.getElementById('currentUrl').textContent = window.location.origin;

        let count = 0;
        const btn = document.getElementById('clickBtn');
        const countSpan = document.getElementById('count');

        btn.addEventListener('click', () => {
            count++;
            countSpan.textContent = count;
        });
    </script>
</body>
</html>
